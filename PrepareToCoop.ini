# Prepare to Co-op Edition  v@COOP@  (Dark Souls: Prepare to Die Edition)
# Includes the DS1 PTDE FPS Unlock v@FPS@: this one file holds the settings of both.
# Place xinput1_3.dll and this file next to DARKSOULS.exe (dxvk_d3d9.dll too, only for the
# FPS Unlock's experimental DXVK). Do not install the FPS Unlock on its own as well: this
# xinput1_3.dll is the FPS Unlock plus the co-op.
# Every player in a session should use the same version of Prepare to Co-op.

[PrepareToCoop]
# Prepare to Co-op Edition: play the whole game together with friends, from the Undead
# Asylum to the Kiln. An independent co-op mod for Prepare to Die Edition, inspired by
# Yui's Seamless Co-op for Remastered (ds1sc). Works whether or not FPSUnlock is on.
# See the README.
#
# How to play: rest at any bonfire and your character receives the co-op items
# (Blessed Eye Orb, Crystal Eye Orb, Chaos Eye Orb, Abyssal Eye Orb, Ominous Tome,
# Dried Fingers, Cursed Pendant, Parchment of Deliverance). One player uses the Blessed
# Eye Orb to host; everyone else with the same Password uses the Crystal Eye Orb and
# arrives at the host's last bonfire, in their own body (not a phantom). Keys do the same:
# Ctrl+F1 host, Ctrl+F2 join, Ctrl+F3 leave, Ctrl+F4 invade.
#
# While this is on:
#  - The title screen reads PREPARE TO CO-OP EDITION, in its opening movie and in the logo
#    after it. A PrepareToCoop-Title.png next to DARKSOULS.exe replaces the built-in logo
#    (512 x 512; docs/PREPARE-TO-COOP.md says which parts the game uses), a
#    PrepareToCoop-Title.wmv the built-in movie (tools/build_title_movie.bat makes one).
#  - The game runs as Steam's Spacewar (app 480): PTDE's own lobbies were switched off in
#    2022. Steam shows you as playing Spacewar.
#  - The game's own online play (messages, bloodstains, signs, invasions) only meets
#    players with the same Password.
#  - Characters live in their own save file (see SaveFileExtension). To bring an existing
#    character, copy Documents\NBGI\DarkSouls\DRAKS0005.sl2 to DRAKS0005.co2 first.
# Up to 4 players (the most PTDE's engine keeps in one world).
PrepareToCoop = true

# Players with the same password find each other. Avoid '#' (it starts a comment here).
Password =

# Others may invade a session as evil spirits (they use the Chaos Eye Orb).
AllowInvaders = true

# Each death in a session adds a Crimson Blossom (up to five); each lowers maximum HP by
# 10% until the next bonfire rest, where they wither.
DeathDebuffs = false

# Guests run the world's scripted events in their own game, as the host does (as in
# ds1sc on Remastered): boss fights, lifts, cutscenes, scripted enemies like the
# Hellkite, and the rewards that come with them. false = the game's own co-op rules
# (only the host's game runs them; guests see what the network passes on).
GuestWorldEvents = true

# The other players see you sit down at a bonfire, rest, kindle, reverse hollowing and
# stand up again (as in ds1sc on Remastered). false = your character stands still
# on their screens while you rest.
BonfireAnimations = true

# The floating health bar over another player: 0 name only, 1 name and ping, 2 name and
# soul level, 3 name and deaths, 4 name, soul level and ping.
OverheadPlayerDisplay = 4

# Enemy scaling per extra player, in percent. Health, damage, and poise (posture).
EnemyHealthScaling = 35
EnemyDamageScaling = 0
EnemyPostureScaling = 15
BossHealthScaling = 100
BossDamageScaling = 0
BossPostureScaling = 20

# The save file's extension while Prepare to Co-op is on (vanilla: sl2).
SaveFileExtension = co2

# Ctrl+F1..F4 shortcuts for host, join, leave and invade (the items work either way).
CoopHotkeys = true

# ---------------------------------------------------------------------------------------
# The FPS Unlock's settings follow (its own file, unchanged; see its README for details).
# ---------------------------------------------------------------------------------------

