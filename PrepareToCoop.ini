# Prepare to Co-op Edition  v@COOP@  (Dark Souls: Prepare to Die Edition)
# Includes the DS1 PTDE FPS Unlock v@FPS@: this one file holds the settings of both.
# Place xinput1_3.dll and this file next to DARKSOULS.exe (dxvk_d3d9.dll too, only for the
# FPS Unlock's experimental DXVK). Do not install the FPS Unlock on its own as well: this
# xinput1_3.dll is the FPS Unlock plus the co-op.
# Prepare to Co-op 1.5.0 plays with players of 1.5.0 or later only (co-op protocol 9): players
# of 1.0.0 to 1.4.0 are told to update when they try to join or invade.

[PrepareToCoop]
# Prepare to Co-op Edition: play the whole game together with friends, from the Undead
# Asylum to the Kiln. An independent co-op mod for Prepare to Die Edition, inspired by
# Yui's Seamless Co-op for Remastered (ds1sc). Works whether or not FPSUnlock is on.
# See the README.
#
# How to play: rest at any bonfire and your character receives the co-op items
# (Blessed Eye Orb, Crystal Eye Orb, Chaos Eye Orb, Abyssal Eye Orb, Ominous Tome,
# Dried Fingers, Cursed Pendant, Parchment of Deliverance). One player uses the Blessed
# Eye Orb to host; everyone else with the same Password uses the Crystal Eye Orb and
# arrives at the host's last bonfire, in their own body (not a phantom). Keys do the same:
# Ctrl+F1 host, Ctrl+F2 join, Ctrl+F3 leave, Ctrl+F4 invade.
#
# While this is on:
#  - The title screen reads PREPARE TO CO-OP EDITION, in its opening movie and in the logo
#    after it. A PrepareToCoop-Title.png next to DARKSOULS.exe replaces the built-in logo
#    (512 x 512; docs/PREPARE-TO-COOP.md says which parts the game uses), a
#    PrepareToCoop-Title.wmv the built-in movie (tools/build_title_movie.bat makes one).
#  - The game runs as Steam's Spacewar (app 480): PTDE's own lobbies were switched off in
#    2022. Steam shows you as playing Spacewar.
#  - The game's own online play (messages, bloodstains, signs, invasions) only meets
#    players with the same Password.
#  - Characters live in their own save file (see SaveFileExtension). To bring an existing
#    character, copy Documents\NBGI\DarkSouls\DRAKS0005.sl2 to DRAKS0005.co2 first.
# Up to 4 players (the most PTDE's engine keeps in one world).
PrepareToCoop = true

# Players with the same password find each other. Avoid '#' (it starts a comment here).
Password =

# Others may invade a session as evil spirits (they use the Chaos Eye Orb).
AllowInvaders = true

# How many players a session holds: the host, the guests and the invaders together, 2 to 8
# (NPC summons do not count). The game itself holds 4; Prepare to Co-op makes room for up to
# 8. Every player's game needs room: a host lets a fifth player in only when every game in the
# session, the joiner's too, is set high enough and runs 1.4.0 or later. Every other player
# gets a floating health bar (the game's HUD has seven); an NPC summon gets one when one is
# left. 4 = the game's own number.
MaxPlayers = 8

# Invasion rewards: an evil spirit who defeats every co-op player gets a Humanity for each
# of them, once back home. When the evil spirit falls instead, the host and every guest
# get a Humanity (fallen ones too). Both sides need Prepare to Co-op 1.1.0.
InvasionRewards = true

# After an invasion of your world ends (every invader has won, fallen, left or been sent
# home), no other invader can come in for this many minutes: 0 (no cooldown) to 10. Fractions work
# (1.5 = 90 seconds). Invaders' searches pass over a world on cooldown and try the others;
# an invader who finds no world that can take them is told how long until the first opens.
# Dried Fingers turn it off until the session ends (a running cooldown ends at their use).
InvasionCooldown = 3

# true = while an invader is in your world, the boss fogs stay shut for you and your guests,
# so a fight with an invader cannot be ended by walking into a boss. false (default) = the
# fogs work as in the unmodded game: you can go in, the invader cannot follow, and your
# entry sends the invader home. The host's setting decides for its world.
SealBossFogsDuringInvasions = false

# Each death in a session adds a Crimson Blossom (up to five; none when the team defeats a
# boss while you are down); each lowers maximum HP by 10%. They wither when anyone in the
# session rests at a bonfire (the health they took comes back), when the whole team falls,
# or when the session ends. On by default since 1.1.0. The Death Knell's price gives you a
# Crimson Blossom whatever this says (false only spares you the ones from deaths).
DeathDebuffs = true

# Each death of a co-op player in a session gives everyone in the session a Bloody Mary (up to
# five). Each raises the health of the world's enemies by a third of EnemyHealthScaling (an enemy
# that is alive gains it on top of the health it has) and the bosses' by an eighth of
# BossHealthScaling. They wither when anyone in the session rests at a bonfire, or when the whole
# team falls. Works alongside DeathDebuffs (either, both or neither). The host's setting decides.
# The Death Knell's price gives everyone a Bloody Mary whatever this says (false only spares
# the session the ones from deaths).
BloodyMary = true

# Guests run the world's scripted events in their own game, as the host does (as in
# ds1sc on Remastered): boss fights, lifts, cutscenes, scripted enemies like the
# Hellkite, and the rewards that come with them. false = the game's own co-op rules
# (only the host's game runs them; guests see what the network passes on).
GuestWorldEvents = true

# The other players see you sit down at a bonfire, rest, kindle, reverse hollowing and
# stand up again (as in ds1sc on Remastered). false = your character stands still
# on their screens while you rest.
BonfireAnimations = true

# Spectating a teammate (after you fall in a boss fight, or with the Death Knell) shows their
# surroundings as if you stood there: your game loads their map when it has not (a teammate far
# away in another area), draws the world from where they stand, and moves and draws the enemies
# around them as it does the ones around you. false = only what your game has loaded around you.
SpectateStreaming = true

# The Death Knell's price. Going to a co-operator costs a Crimson Blossom (yours), a Bloody Mary
# (everyone's: the enemies grow hardier) and, as the Darksign does, every soul and all humanity
# you carry. Going to a co-operator's summon sign (left with the Vigil Soapstone) costs only
# the Blossom and the Bloody Mary. true = going to a co-operator takes one soul level instead of
# the souls and humanity (never below your class's starting level).
DeathKnellSoulLevel = false

# An item a co-op player drops (a weapon, a shield, a soul: anything the game lets you
# drop for other players) lies on every co-op player's floor, and the first to pick it up
# has it: it is gone from everyone's floor. Invaders neither see nor drop them. The host's
# setting decides for the session (guests need 1.4.0 too). false = a drop stays in its
# player's game, as before 1.4.0.
ShareDroppedItems = true

# The floating health bar over another player: 0 name only, 1 name and ping, 2 name and
# soul level, 3 name and deaths, 4 name, soul level and ping, 5 name, soul level, ping and
# "lerp", the smoothing their character is drawn with (see DynamicSmoothing). The name is
# their character's; the ping is your own round trip to them, four times a second.
OverheadPlayerDisplay = 5

# How many times a second the games of your session send where their player is (and the
# enemies they move): 6 is the game's own rate, up to 60. 30 is the default and a big
# improvement over the game's 6 for most things. 60 is viable, and recommended when everyone
# in the session has a low-latency or excellent connection: it draws the others closest to
# where they really are (rolls, swings, turns and enemies line up better), for twice the
# upload of 30 (about 2 KB a second to each other player at 30). On an uneven connection
# raise NetworkSmoothing rather than lowering this. The host's setting is used by everyone
# in the session (guests and invaders use their host's; players of 1.2.0 or older still
# send 6).
NetworkTickRate = 30

# Above 6 updates a second: how many ms the other players' characters (and the enemies the
# other games move) stay behind their updates, as a margin for updates that come a little
# late. Each player's own setting, 0 to 200. A character is drawn about one update interval
# plus this behind (plus the ping): with 33, about 66 ms at 30 a second, 50 ms at 60 and
# 100 ms at 15 (6 a second: 200 ms, the game's own). 33 ms is about one frame at 30 FPS or
# two at 60 FPS, enough to hide most ping and latency spikes. Lower is snappier but can
# stutter on an uneven connection; raise it if other players move in jerks. With
# DynamicSmoothing on, this is only where each character's smoothing starts.
NetworkSmoothing = 33

# Above 6 updates a second: the smoothing follows each connection by itself. Every other
# player's character, and every enemy another player's game moves, gets its own, from how
# evenly its updates arrive: down to 25 ms on a steady connection, up to 200 ms on a poor one
# (players across the world, 200 ms pings, Wi-Fi), rising quickly when updates start coming
# late and falling back within a few seconds once they are steady again. Only the network
# counts: your own game's frame rate and stalls (a slow PC, a Steam Deck loading effects) do
# not. Each player's own setting. The value in use is shown on the floating health bars
# ("lerp", OverheadPlayerDisplay = 5).
# false = NetworkSmoothing for everyone, always.
DynamicSmoothing = true

# Each enemy is scaled for the co-op players near it, not for everyone in the session: an
# enemy counts a player while that player's game has it active (near enough to move; the same
# test that decides who gets a kill's souls). Two players in the Undead Burg and two in the
# Catacombs each fight enemies scaled for two. An enemy's scaling follows the players as they
# come and go, and it keeps its share of health when it changes. false = every enemy is
# scaled for every co-op player in the session, as before 1.5.0. The host's setting decides.
VicinityScaling = true

# Enemy scaling per extra player, in percent. Health, damage, and poise (posture).
EnemyHealthScaling = 50
EnemyDamageScaling = 0
EnemyPostureScaling = 35
BossHealthScaling = 150
BossDamageScaling = 0
BossPostureScaling = 40

# The save file's extension while Prepare to Co-op is on (vanilla: sl2).
SaveFileExtension = co2

# Ctrl+F1..F4 shortcuts for host, join, leave and invade (the items work either way).
CoopHotkeys = true

# At each start, look on Prepare to Co-op's GitHub Releases page for a newer version, and
# say so on the title screen when there is one (it goes away once a character is loaded).
# One small request to api.github.com; nothing else is sent. false = no check.
CheckForUpdates = true

# Send this game's log to Prepare to Co-op's developer, to help find and fix problems. Turn
# it on only when the developer asks you to and gives you an address. The log goes up when
# the game closes; a log a crash left behind goes at the next start. Off by default: nothing
# is sent unless UploadLogs is true and UploadLogsTo is set. The log holds your Steam name
# and id and those of the players you met, your characters' names, this PC's name, and what
# the mod did.
# UploadLogsTo: the address the developer gave you, https://user:password@host/folder/. The
# user and password in it are the developer's upload account, not yours: it can only add
# logs to that one folder, and cannot see, read or delete anything there.
# UploadLogsName: the name your logs are filed under, so the developer can tell whose logs
# they are (letters, digits, - and _; anything else becomes _). Empty = this PC's name.
UploadLogs = false
UploadLogsTo =
UploadLogsName =

# ---------------------------------------------------------------------------------------
# The FPS Unlock's settings follow (its own file, unchanged; see its README for details).
# ---------------------------------------------------------------------------------------

